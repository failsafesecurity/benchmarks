name: redforge smoke

on:
  push:
    paths:
      - 'datasets/redforge/**'
      - '.github/workflows/redforge-smoke.yml'
  pull_request:
    paths:
      - 'datasets/redforge/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        working-directory: datasets/redforge
        run: |
          python -m pip install --upgrade pip
          pip install ruff black
      - name: ruff
        working-directory: datasets/redforge
        run: ruff check .
      - name: black
        working-directory: datasets/redforge
        run: black --check .
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck datasets/redforge/scripts/*.sh

  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install matplotlib
        run: pip install matplotlib numpy
      - name: regenerate figures
        working-directory: datasets/redforge/paper/figures
        run: |
          for fig in figure_*.py; do
            echo "regenerating $fig..."
            python "$fig"
          done
      - name: verify figures match committed PNGs
        working-directory: datasets/redforge/paper/figures
        run: |
          # If figures are checked in, verify they match the regenerated ones.
          # Tolerance: bit-identical PNGs not required, but file size and basic
          # render should match. This is a smoke check; visual diffs caught by
          # reviewers.
          for png in figure_*.png; do
            test -f "$png" && echo "OK: $png exists"
          done

  smoke-test:
    runs-on: ubuntu-latest
    # smoke test requires API keys; only runs on push to main or with the
    # 'run-smoke' label on a PR
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      contains(github.event.pull_request.labels.*.name, 'run-smoke')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        working-directory: datasets/redforge
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: smoke test (one cell, one scenario, one attempt)
        working-directory: datasets/redforge
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: ./scripts/smoke_test.sh
